name: relay

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，例如 0.2.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: relay-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Resolve version
        run: |
          RAW="${{ github.event.inputs.version }}"
          VERSION="${RAW#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$SIGNING_KEY" ] || { echo "::error::缺少 SIGNING_KEY secret"; exit 1; }
          key="$RUNNER_TEMP/update.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"
          chmod 600 "$key"
          PUB=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | base64)

          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.signingKey=${PUB}" \
              -o "dist/relay-${os}-${arch}" .
          done
          ls -lh dist

      - name: Generate feed
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/update.pem"
          printf '%s\n' "$SIGNING_KEY" > "$key"

          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          python3 scripts/gen-feed.py "$VERSION" "$BASE" dist "$key" "$RUNNER_TEMP/feed.json"
          cp "$RUNNER_TEMP/feed.json" dist/feed.json
          cat dist/feed.json

      - name: Assert assets
        run: |
          n=$(ls dist | wc -l | tr -d ' ')
          echo "assets: $n"
          [ "$n" -ge 6 ] || { echo "::error::产物不全"; exit 1; }

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "relay $TAG" --notes "自更新实验版"
          else
            gh release create "$TAG" dist/* \
              --title "relay $TAG" --notes "自更新实验版" --verify-tag
          fi
