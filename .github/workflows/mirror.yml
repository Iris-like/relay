name: mirror

# 从 relay-releases 拉取最新 Release，在 relay 仓库建一份镜像。
# 读源仓库用匿名 GitHub API（公开仓库，不需要跨仓库 token）；
# 写本仓库用自带的 GITHUB_TOKEN。

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_API: https://api.github.com/repos/Llikey/relay-releases
    steps:
      - name: Read the latest release
        id: src
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 "$SOURCE_API/releases/latest" -o /tmp/latest.json
          python3 - <<'PY'
          import json

          d = json.load(open("/tmp/latest.json"))
          open("/tmp/tag", "w").write(d["tag_name"])
          open("/tmp/name", "w").write(d.get("name") or d["tag_name"])
          open("/tmp/notes.md", "w").write(d.get("body") or "")
          with open("/tmp/assets", "w") as f:
              for a in d.get("assets", []):
                  f.write(f"{a['name']}\t{a['browser_download_url']}\n")
          PY
          TAG=$(cat /tmp/tag)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "latest: $TAG"

      - name: Skip when already mirrored
        id: check
        run: |
          set -euo pipefail
          TAG="${{ steps.src.outputs.tag }}"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "mirrored=true" >> "$GITHUB_OUTPUT"
            echo "$TAG already mirrored"
          else
            echo "mirrored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide the Latest mark
        if: steps.check.outputs.mirrored == 'false'
        id: latest
        run: |
          set -euo pipefail
          TAG="${{ steps.src.outputs.tag }}"
          TOP=$(gh release list -R "$GITHUB_REPOSITORY" -L 100 --exclude-drafts --exclude-pre-releases \
            --json tagName -q '.[].tagName' | { grep -E '^v[0-9.]+$' || true; } | sort -V | tail -1)
          if [ -z "$TOP" ] || [ "$(printf '%s\n%s\n' "$TOP" "$TAG" | sort -V | tail -1)" = "$TAG" ]; then
            echo "make=true" >> "$GITHUB_OUTPUT"
          else
            echo "make=false" >> "$GITHUB_OUTPUT"
            echo "$TOP is newer; $TAG will not take Latest"
          fi

      - name: Download and publish
        if: steps.check.outputs.mirrored == 'false'
        env:
          TAG: ${{ steps.src.outputs.tag }}
          MAKE: ${{ steps.latest.outputs.make }}
        run: |
          set -euo pipefail
          mkdir -p dist
          while IFS=$'\t' read -r name url; do
            [ -n "$name" ] || continue
            echo "  $name"
            curl -fsSL --retry 3 -o "dist/$name" "$url"
          done < /tmp/assets
          ls -lh dist
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" \
            --title "$(cat /tmp/name)" \
            --notes-file /tmp/notes.md \
            --verify-tag \
            --latest="$MAKE"
          echo "mirrored $TAG"
